<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen justify-center bg-neutral-950 text-white">
    
    <div class="bg-neutral-900 border-b border-neutral-700 h-22 w-full flex items-center gap-4 px-6">
        <img src="assets/logo.png" class="w-10 h-10" alt="Logo">
        <h1 class="text-xl">Drawing App</h1>

        <button class="ml-auto mr-6 text-neutral-300 hover:text-white cursor-pointer" onclick="clearCanvas()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-trash"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/></svg>
        </button>
        <button class="text-neutral-300 hover:text-white disabled:text-neutral-600 disabled:cursor-not-allowed disabled:hover:text-neutral-600 cursor-pointer" id="undoButton" onclick="undo()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-back-up"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M9 14l-4 -4l4 -4" /><path d="M5 10h11a4 4 0 1 1 0 8h-1" /></svg>
        </button>
        <button class="text-neutral-300 hover:text-white disabled:text-neutral-600 disabled:cursor-not-allowed disabled:hover:text-neutral-600 cursor-pointer" id="redoButton" onclick="redo()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-forward-up"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M15 14l4 -4l-4 -4" /><path d="M19 10h-11a4 4 0 1 0 0 8h1" /></svg>
        </button>

        <button onclick="saveDrawing()" class="flex justify-center items-center bg-indigo-500/70 w-32 h-14 rounded-lg ml-6 hover:bg-indigo-500/90 transition group">
            <svg class="w-5 h-5 mr-2 text-indigo-100/80 group-hover:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="icon icon-tabler icons-tabler-filled icon-tabler-device-floppy"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M16 3a1 1 0 0 1 .707 .293l4 4a1 1 0 0 1 .293 .707v10a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-12a3 3 0 0 1 3 -3h1v4a1 1 0 0 0 .883 .993l.117 .007h6a1 1 0 0 0 1 -1v-4zm-4 8a2.995 2.995 0 0 0 -2.995 2.898a1 1 0 0 0 -.005 .102a3 3 0 1 0 3 -3m1 -8v3h-4v-3z" /></svg>
            <p class="text-indigo-100/80 group-hover:text-white cursor-pointer">Save</p>
        </button>
    </div>

    <div class="flex flex-1 min-h-0 min-w-0">

        <aside class="bg-neutral-900/80 border-r border-neutral-700 px-3 py-5 w-38">
            <button data-tool="brush" data-active="true" class="data-[active=true]:bg-indigo-500/20 data-[active=true]:text-indigo-400  flex flex-col text-neutral-400 justify-center items-center rounded-lg hover:bg-neutral-800/30 transition w-32 h-24 group cursor-pointer">
                <svg class="w-8 h-8 mb-2 group-hover:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brush"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 21v-4a4 4 0 1 1 4 4h-4" /><path d="M21 3a16 16 0 0 0 -12.8 10.2" /><path d="M21 3a16 16 0 0 1 -10.2 12.8" /><path d="M10.6 9a9 9 0 0 1 4.4 4.4" /></svg>
                <p class="group-hover:text-white">Brush</p>
            </button>
            <button data-tool="eraser" class="data-[active=true]:bg-indigo-500/20 data-[active=true]:text-indigo-400  flex flex-col text-neutral-400 justify-center items-center rounded-lg hover:bg-neutral-800/30 transition w-32 h-24 group cursor-pointer">
                <svg class="w-8 h-8 mb-2 group-hover:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-eraser"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M19 20h-10.5l-4.21 -4.3a1 1 0 0 1 0 -1.41l10 -10a1 1 0 0 1 1.41 0l5 5a1 1 0 0 1 0 1.41l-9.2 9.3" /><path d="M18 13.3l-6.3 -6.3" /></svg>
                <p class="group-hover:text-white">Eraser</p>
            </button>
            <button data-tool="line" class="data-[active=true]:bg-indigo-500/20 data-[active=true]:text-indigo-400  flex flex-col text-neutral-400 justify-center items-center rounded-lg hover:bg-neutral-800/30 transition w-32 h-24 group cursor-pointer">
                <svg class="w-8 h-8 mb-2 group-hover:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-stroke-straight"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 19l16 -14" /></svg>
                <p class="group-hover:text-white">Line</p>
            </button>
            <button data-tool="rectangle" class="data-[active=true]:bg-indigo-500/20 data-[active=true]:text-indigo-400  flex flex-col text-neutral-400 justify-center items-center rounded-lg hover:bg-neutral-800/30 transition w-32 h-24 group cursor-pointer">
                <svg class="w-8 h-8 mb-2 group-hover:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-rectangle"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" /></svg>
                <p class="group-hover:text-white">Rectangle</p>
            </button>
            <button data-tool="ellipse" class="data-[active=true]:bg-indigo-500/20 data-[active=true]:text-indigo-400  flex flex-col text-neutral-400 justify-center items-center rounded-lg hover:bg-neutral-800/30 transition w-32 h-24 group cursor-pointer">
                <svg class="w-8 h-8 mb-2 group-hover:text-white" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-oval-vertical"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 12c0 -3.314 4.03 -6 9 -6s9 2.686 9 6s-4.03 6 -9 6s-9 -2.686 -9 -6" /></svg>
                <p class="group-hover:text-white">Ellipse</p>
            </button>
            <button data-tool="text" class="data-[active=true]:bg-indigo-500/20 data-[active=true]:text-indigo-400  flex flex-col text-neutral-400 justify-center items-center rounded-lg hover:bg-neutral-800/30 transition w-32 h-24 group cursor-pointer">
                <svg class="w-8 h-8 mb-2" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-letter-a"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M7 20v-12a4 4 0 0 1 4 -4h2a4 4 0 0 1 4 4v12" /><path d="M7 13l10 0" /></svg>
                <p class="group-hover:text-white">Text</p>
            </button>
        </aside>

        <div class="flex flex-col flex-1 min-w-0 min-h-0">
            <canvas id="canvas" class="flex-28 bg-white rounded min-w-0 min-h-0 m-4"></canvas>
            <footer class="flex gap-4 justify-center items-center flex-1 bg-neutral-900 border-t border-neutral-700 text-neutral-400 text-sm overflow-hidden">
                <div>© 2026 My Drawing App v1.0.0. All rights reserved.</div>
                <div>Commands: Ctrl+Z (Undo), Ctrl+Shift+Z (Redo), Ctrl+S (Save), Ctrl+D (Clear), 1-6 (Tools)</div>
                <div>Coded by Unholyangel</div>
            </footer>
        </div>
        <aside class="bg-neutral-900/80 border-l border-neutral-700 px-3 py-5 w-64">
            <div class="flex flex-col gap-4">
                <div class="bg-neutral-800/50 p-3 border border-neutral-700/50 rounded">
                    <label for="color" class="text-neutral-300">Color</label>
                    <input type="color" id="color" class="w-full h-14 cursor-pointer">
                </div>
                <div class="bg-neutral-800/50 p-3 border border-neutral-700/50 rounded">
                    <label for="size" class="text-neutral-300">Size</label>
                    <input type="range" id="size" min="1" max="50" value="5" class="slider w-full h-12 cursor-pointer accent-indigo-500">
                </div>
                <div class="bg-neutral-800/50 p-3 border border-neutral-700/50 rounded">
                    <label for="opacity" class="text-neutral-300">Opacity</label>
                    <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="1" class="slider w-full h-12 cursor-pointer accent-indigo-500">
                </div>
            </div>

        </aside>

    </div>

    <script src="app.js"></script>
</body>
</html>
